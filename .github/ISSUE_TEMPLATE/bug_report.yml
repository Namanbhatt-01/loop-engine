name: 🐛 Bug Report
description: File a bug report to help us improve Loop Engine Core
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: input
    id: environment
    attributes:
      label: Operating System & Environment
      description: What OS, Go version, and Python version are you using?
      placeholder: "e.g., macOS Sequoia (Apple Silicon), Go 1.22, Python 3.11"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or Loopfile.yaml configuration to reproduce the issue.
      placeholder: |
        1. Configure Loopfile.yaml with ...
        2. Run ./scripts/run_loop.sh
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Diagnostics
      description: Paste any stderr, compiler, or daemon logs here.
      render: shell
